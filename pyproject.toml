[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd2-fishing"
version = "0.2.0"
description = "BrownDust II Fishing Voyage desktop assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dxcam==0.3.0",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "onnxruntime==1.24.4",
    "PyDirectInput==1.0.4",
    "pywin32==311",
    "rapidocr==3.7.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]
dev = ["ruff==0.16.6"]

[project.gui-scripts]
bd2-fishing = "bd2_fishing.bootstrap:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bd2_fishing*"]
namespaces = false

[tool.setuptools.package-data]
"bd2_fishing" = ["resources/*.ini", "resources/icons/*.ico", "resources/icons/*.png"]
"bd2_fishing.game.fishing" = ["assets/*.png", "assets/README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".local/cache/ruff"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bd2_fishing", "tests", "scripts"]
