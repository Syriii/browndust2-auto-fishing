name: Build Release Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements/windows-py312.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Offline regression
        run: python -X utf8 -B -m unittest discover -s tests -v

      - name: Build release package
        run: |
          python scripts/build_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BD2_AutoFishing-windows
          path: .local/releases/BD2_AutoFishing-windows.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload zip to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: .local/releases/BD2_AutoFishing-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
